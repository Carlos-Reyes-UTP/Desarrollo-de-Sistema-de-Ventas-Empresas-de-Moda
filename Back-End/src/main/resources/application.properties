spring.application.name=ropa
spring.datasource.url=jdbc:postgresql://localhost:5432/tiendaropadk
spring.datasource.username=postgres
spring.datasource.password=18092004

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# Evita lazy loads extra durante serialización JSON (Fase rendimiento)
spring.jpa.open-in-view=false   
# Dev: SPRING_JPA_GENERATE_STATS=true y LOG_HIBERNATE_STAT=DEBUG para auditar N+1
spring.jpa.properties.hibernate.generate_statistics=${SPRING_JPA_GENERATE_STATS:false}
logging.level.org.hibernate.stat=${LOG_HIBERNATE_STAT:WARN}
# Umbral (ms) para log de peticiones lentas en SlowRequestLoggingFilter
app.performance.slow-request-ms=1000

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# El repair() automatico se ejecuta vía FlywayConfig.repairAndMigrateStrategy.
# Permite aplicar V0 en equipos que ya tenían V1+ sin V0 (V0 es idempotente con IF NOT EXISTS).
spring.flyway.out-of-order=true

security.jwt.key=07e919ee49af082a1c9e8051331d55ae5a1d7ff8c8c7a568149f9f4dbefd89cd
security.jwt.user.generator=appRopaGrupoBtfld5

# Reservas blandas: solicitudes VENTA PENDIENTE sin atender (0 = desactivar expiración automática)
solicitud.reserva.ttl-minutos=90
solicitud.reserva.expiracion-intervalo-ms=300000

# Venta directa: permite descontar stock directo desde almacen si el piso no tiene stock
venta.directa.habilitada=false
