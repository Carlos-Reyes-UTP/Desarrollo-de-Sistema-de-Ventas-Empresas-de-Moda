<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Token JWT</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .token-info { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .decoded { background: #e8f5e8; padding: 15px; border-radius: 5px; margin: 10px 0; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>JWT Token Debug Tool</h1>
    
    <div>
        <h3>Token desde LocalStorage:</h3>
        <div id="localStorage-token" class="token-info">
            <button onclick="getTokenFromStorage()">Obtener Token del LocalStorage</button>
            <div id="storage-result"></div>
        </div>
    </div>

    <div>
        <h3>Decodificar Token Manual:</h3>
        <textarea id="manual-token" placeholder="Pega aquí tu token JWT..."></textarea>
        <button onclick="decodeManualToken()">Decodificar Token</button>
        <div id="manual-result" class="decoded"></div>
    </div>

    <script src="https://unpkg.com/jwt-decode@4.0.0/build/cjs/index.js"></script>
    <script>
        function getTokenFromStorage() {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('storage-result');
            
            if (token) {
                resultDiv.innerHTML = `
                    <p><strong>Token encontrado:</strong></p>
                    <textarea readonly style="height: 60px;">${token}</textarea>
                    <button onclick="decodeStorageToken('${token}')">Decodificar este Token</button>
                `;
            } else {
                resultDiv.innerHTML = '<p style="color: red;"><strong>No se encontró token en localStorage</strong></p>';
            }
        }

        function decodeStorageToken(token) {
            decodeToken(token, 'storage-result');
        }

        function decodeManualToken() {
            const token = document.getElementById('manual-token').value.trim();
            if (token) {
                decodeToken(token, 'manual-result');
            } else {
                document.getElementById('manual-result').innerHTML = '<p style="color: red;">Por favor ingresa un token</p>';
            }
        }

        function decodeToken(token, targetId) {
            try {
                // Función simple para decodificar JWT sin librerías
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const decoded = JSON.parse(jsonPayload);
                const currentTime = Math.floor(Date.now() / 1000);
                
                const resultDiv = document.getElementById(targetId);
                resultDiv.innerHTML = `
                    <h4>Token Decodificado:</h4>
                    <pre style="background: white; padding: 10px; border: 1px solid #ddd; border-radius: 3px; overflow: auto;">${JSON.stringify(decoded, null, 2)}</pre>
                    <p><strong>Usuario (sub):</strong> ${decoded.sub || 'No encontrado'}</p>
                    <p><strong>Authorities:</strong> ${decoded.authorities || 'No encontrado'}</p>
                    <p><strong>Expira:</strong> ${new Date(decoded.exp * 1000).toLocaleString()}</p>
                    <p><strong>Estado:</strong> ${decoded.exp > currentTime ? 
                        '<span style="color: green;">✅ Válido</span>' : 
                        '<span style="color: red;">❌ Expirado</span>'}</p>
                `;
            } catch (error) {
                document.getElementById(targetId).innerHTML = `<p style="color: red;"><strong>Error decodificando token:</strong> ${error.message}</p>`;
            }
        }

        // Auto-cargar token al abrir la página
        window.onload = function() {
            getTokenFromStorage();
        }
    </script>
</body>
</html>
